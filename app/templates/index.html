<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InternTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <h1>InternTrack</h1>
    <p>Every application, interview and offer in one place.</p>
  </header>

  <main class="layout">
    <aside>
      <form id="add-form" class="panel">
        <h2>Add application</h2>
        <label>Company <input name="company" required maxlength="80"></label>
        <label>Role <input name="role" required maxlength="80"></label>
        <label>Location <input name="location" maxlength="80"></label>
        <label>Status
          <select name="status">
            {% for s in statuses %}<option{{ ' selected' if s == 'Applied' }}>{{ s }}</option>{% endfor %}
          </select>
        </label>
        <label>Applied on <input type="date" name="applied_on" required></label>
        <label>Job link <input type="url" name="link" placeholder="https://"></label>
        <label>Notes <textarea name="notes" rows="3" maxlength="500"></textarea></label>
        <p id="error" role="alert"></p>
        <button type="submit">Save application</button>
      </form>
    </aside>

    <section class="content">
      <div class="panel pipeline-panel">
        <div class="headline">
          <div><b id="total">0</b> applications</div>
          <div><b id="rate">0%</b> reached an interview</div>
        </div>
        <div id="pipeline" class="pipeline" aria-label="Applications by status"></div>
        <ul id="legend" class="legend"></ul>
      </div>

      <div class="panel">
        <h2>Applications sent per week</h2>
        <div id="weekly" class="weekly"></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <h2>All applications</h2>
          <input id="search" type="search" placeholder="Search company or role" aria-label="Search">
          <select id="filter" aria-label="Filter by status">
            <option value="">All statuses</option>
            {% for s in statuses %}<option>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Company</th><th>Role</th><th>Location</th><th>Applied</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p id="none" class="empty" hidden>No applications match. Add one on the left.</p>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
